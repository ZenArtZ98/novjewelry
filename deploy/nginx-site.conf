# Include inside your existing HTTPS server {} block.
# Deploy dist/ and .build/security-headers.conf together, keeping these paths aligned.
root /var/www/nov/dist;
include /var/www/nov/.build/security-headers.conf;

error_page 404 /404.html;
location = / {
    expires -1;
    try_files /index.html =404;
}
location = /index.html {
    return 308 /$is_args$args;
}
location = /404.html {
    internal;
    expires -1;
}
location ~ /\. { deny all; }
location ~ ^/_(headers|redirects)$ { return 404; }
location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
    expires 1y;
    try_files $uri =404;
}
location ~ \.(webp|svg|otf|ttf|txt|xml|css)$ {
    expires 1h;
    try_files $uri =404;
}
location / {
    try_files $uri =404;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/xml image/svg+xml;

# Configure TLS and the HTTP -> HTTPS redirect in the hosting control panel
# or the outer server blocks. Enable HSTS only once HTTPS is working.
# Do not add an SPA fallback such as: try_files $uri /index.html;
